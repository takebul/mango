<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Mango Fruit Gradient -->
    <linearGradient id="mangoBody" x1="12" y1="12" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="mangoLeaf" x1="32" y1="4" x2="48" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCover" x1="16" y1="26" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Mango Fruit Silhouette -->
  <path
    d="M32 10C21 10 13 19 13 32C13 46 22 56 34 56C47 56 53 45 53 33C53 19 44 10 32 10Z"
    fill="url(#mangoBody)"
    filter="url(#softGlow)"
  />

  <!-- Emerald Sprout Leaf -->
  <path
    d="M32 10C35 5 44 4 48 8C48 14 41 16 32 10Z"
    fill="url(#mangoLeaf)"
  />

  <!-- Stem -->
  <path
    d="M32 10C31 7 32 5 33 4"
    stroke="#047857"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Open Book Foreground -->
  <!-- Left Page -->
  <path
    d="M32 46C26 44 20 44 17 45.5V30C20 28.5 26 28.5 32 31V46Z"
    fill="url(#bookCover)"
    stroke="#78350f"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <!-- Right Page -->
  <path
    d="M32 46C38 44 44 44 47 45.5V30C44 28.5 38 28.5 32 31V46Z"
    fill="url(#bookCover)"
    stroke="#78350f"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Book Spine Center -->
  <path
    d="M32 31V46.5"
    stroke="#78350f"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Left Page Text Lines -->
  <line x1="20" y1="33.5" x2="29" y2="33.5" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
  <line x1="20" y1="37" x2="28" y2="37" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
  <line x1="20" y1="40.5" x2="27" y2="40.5" stroke="#d97706" stroke-width="1" stroke-linecap="round" />

  <!-- Right Page Text Lines -->
  <line x1="35" y1="33.5" x2="44" y2="33.5" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
  <line x1="36" y1="37" x2="44" y2="37" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
  <line x1="37" y1="40.5" x2="44" y2="40.5" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
</svg>
